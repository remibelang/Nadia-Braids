<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-crown"></i>
            <span>Royal Braids</span>
        </div>
        <nav class="sidebar-nav">
            <a href="admin-dashboard.html">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="admin-services.html">
                <i class="fas fa-cut"></i>
                <span>Services</span>
            </a>
            <a href="admin-gallery.html">
                <i class="fas fa-images"></i>
                <span>Gallery</span>
            </a>
            <a href="admin-settings.html" class="active">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
            <a href="#" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <h2>Business Settings</h2>
            <div class="admin-user">
                <span id="admin-email">Admin</span>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>

        <div class="admin-content">
            <div class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-store"></i> Business Information</h3>
                </div>
                <form id="settings-form" class="admin-form">
                    <div class="form-group">
                        <label>Business Name</label>
                        <input type="text" id="setting-name" placeholder="Royal Braids">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea id="setting-address" rows="2" placeholder="123 Beauty Lane, Atlanta, GA 30309"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="setting-phone" placeholder="(404) 555-0123">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="setting-email" placeholder="bookings@royalbraids.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>About Text</label>
                        <textarea id="setting-about" rows="4" placeholder="Description for your about section..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Hero Image URL</label>
                        <input type="url" id="setting-hero" placeholder="https://example.com/hero.jpg">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </form>
                <div id="settings-message" class="message"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-settings.js"></script>
</body>
</html>
